name: Windows MSVC
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      MOODFLOW_APP_VERSION: 0.124.1-beta
    defaults:
      run:
        working-directory: moodflow-setting
    steps:
      - uses: actions/checkout@v4
        with:
          path: moodflow-setting
      - uses: actions/checkout@v4
        with:
          repository: young8290/Moodflow
          ref: af3dcfa46ba14c4c1fa7a6a0f923f2007cf4b5b2
          path: Moodflow
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: moodflow-setting
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --test-threads=2
      - run: cargo build --release
